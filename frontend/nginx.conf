server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://sql-agent-jwi7.onrender.com/api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host sql-agent-jwi7.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /charts/ {
        proxy_pass https://sql-agent-jwi7.onrender.com/charts/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host sql-agent-jwi7.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /docs {
        proxy_pass https://sql-agent-jwi7.onrender.com/docs;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host sql-agent-jwi7.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /redoc {
        proxy_pass https://sql-agent-jwi7.onrender.com/redoc;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host sql-agent-jwi7.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
